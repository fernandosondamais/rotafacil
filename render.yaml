services:
  - type: web
    name: rotafacil
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: APP_PASSWORD
        sync: false
      - key: APP_SEED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: rotafacil-db
          property: connectionString

databases:
  - name: rotafacil-db
    plan: free
